<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <style>
      body { margin: 0; min-height: 1100px; font-family: sans-serif; }
      main { padding: 40px; background: linear-gradient(#eaf7ff, #ffffff); }
      .cookie-banner {
        position: fixed;
        z-index: 20;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 32px;
        background: rgb(220, 35, 55);
        color: white;
      }
    </style>
  </head>
  <body>
    <main><h1>Banner sem recusa</h1><p>Conteúdo determinístico.</p></main>
    <div class="cookie-banner" role="dialog" aria-label="Cookie consent">
      Este banner só oferece aceite.
      <button type="button">Aceitar</button>
    </div>
  </body>
</html>
