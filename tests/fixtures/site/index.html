<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Fixture</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      header { padding: 20px; background: rgb(21, 67, 96); color: white; }
      header a { color: white; margin-right: 12px; }
      main { min-height: 1500px; padding: 24px; background: white; }
      #lazy-hero {
        height: 420px;
        margin-top: 950px;
        background: rgb(248, 248, 248);
      }
      #lazy-hero.rendered {
        background: linear-gradient(135deg, rgb(35, 170, 120), rgb(99, 44, 180));
      }
      footer { padding: 28px; background: rgb(28, 28, 28); color: white; }
      footer a { color: white; margin-right: 12px; }
      .cookie-banner {
        position: fixed;
        z-index: 20;
        left: 20px;
        right: 20px;
        bottom: 20px;
        padding: 18px;
        background: rgb(255, 210, 40);
        color: rgb(20, 20, 20);
      }
    </style>
  </head>
  <body>
    <nav aria-label="Trilha de navegação">
      <a href="/breadcrumb.html">Página ancestral</a>
    </nav>
    <header>
      <nav aria-label="Menu principal">
        <a href="/">Home</a>
        <a href="/servicos.html">Serviços</a>
        <a href="/contato.html#formulario">Contato</a>
        <a href="/servicos.html#precos">Serviços repetidos</a>
        <a href="https://portal.example.test/">Portal do cliente</a>
        <a href="mailto:fixture@example.test">E-mail</a>
        <a href="tel:+5511999999999">Telefone</a>
      </nav>
    </header>
    <main>
      <h1>Site de teste</h1>
      <div id="lazy-hero" aria-label="Conteúdo carregado ao rolar"></div>
    </main>
    <footer>
      <a href="/privacidade.html">Política de Privacidade</a>
      <a href="/cookies.html">Política de Cookies</a>
      <a href="/contato.html">Contato duplicado</a>
      <a href="/carreiras.html">Carreiras</a>
      <a href="https://instagram.com/fixture">Instagram</a>
      <a href="mailto:fixture@example.test">Fale conosco</a>
      <a href="tel:+5511999999999">Telefone</a>
      <a href="/agencia.html">Desenvolvido por Agência</a>
      <a href="/outra-agencia.html">Agência Exemplo</a>
    </footer>
    <div class="cky-consent-container cookie-banner">
      Cookies opcionais estão desativados.
      <button class="cky-btn-reject" type="button">Recusar</button>
    </div>
    <script>
      const lazyHero = document.querySelector("#lazy-hero");
      const observer = new IntersectionObserver((entries) => {
        if (entries.some((entry) => entry.isIntersecting)) {
          observer.disconnect();
          setTimeout(() => {
            fetch("/lazy.txt")
              .then((response) => response.text())
              .then(() => lazyHero.classList.add("rendered"));
          }, 100);
        }
      });
      observer.observe(lazyHero);
      document.querySelector(".cky-btn-reject").addEventListener("click", () => {
        document.querySelector(".cookie-banner").remove();
      });
    </script>
  </body>
</html>
