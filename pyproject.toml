[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "report-generator9000"
version = "0.1.0"
description = "Deterministic SEBRAETEC final report generation toolkit"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140,<0.141",
    "google-genai>=2.6,<3",
    "Pillow>=11",
    "playwright>=1.61,<1.62",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.35,<1",
]

[project.scripts]
check = "report_generator9000.cli:check_main"
inventory = "report_generator9000.cli:inventory_main"
report-generator9000 = "report_generator9000.cli:main"
gerar-relatorio = "report_generator9000.generate_cli:main"

[tool.setuptools.packages.find]
include = ["report_generator9000*"]

[tool.setuptools.package-data]
report_generator9000 = [
    "assets/*.ttf",
    "assets/*.txt",
    "assets/*.md",
    "assets/*.pb",
    "web_dist/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[dependency-groups]
dev = [
    "fonttools>=4.55",
    "httpx2>=2,<3",
    "pytest>=8",
]
