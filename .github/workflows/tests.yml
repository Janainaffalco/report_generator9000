name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --editable . pytest
      - name: Verify the synthetic DOCX is reproducible
        run: |
          python tests/fixtures/generate_minimal_docx.py
          git diff --exit-code -- tests/fixtures/minimal.docx
      - run: python -m pytest
